<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebMarket | Chợ Giao Diện Cao Cấp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-200 text-slate-800 dark:text-slate-200 font-sans">

    <!-- Header chuyên nghiệp -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            
            <!-- Logo bên trái -->
            <a href="index.html" class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 flex items-center gap-2">
                <i class="fa-solid fa-layer-group text-indigo-600"></i> WebMarket
            </a>
            
            <!-- Menu bên phải -->
            <div class="flex items-center gap-5 md:gap-8">
                <!-- Khu vực hiển thị Nút Đăng nhập hoặc Avatar User (Được JS tự động điền) -->
                <div id="auth-menu-container" class="hidden md:flex items-center gap-4">
                    <!-- JS sẽ render UI vào đây -->
                </div>

                <div class="w-px h-6 bg-slate-300 dark:bg-slate-700 hidden md:block"></div>
                
                <button id="theme-toggle" class="text-slate-500 hover:text-indigo-600 transition-colors text-lg"><i class="fa-solid fa-moon"></i></button>
                
                <a href="cart.html" class="relative text-slate-700 dark:text-slate-300 hover:text-indigo-600 transition-colors text-xl">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-rose-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center border-2 border-white dark:border-slate-900 box-content">0</span>
                </a>
            </div>
            
        </div>
    </header>

    <!-- Hero Section phong cách ThemeForest -->
    <section class="relative bg-slate-900 text-white overflow-hidden">
        <!-- Background Pattern/Gradient -->
        <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 via-slate-900 to-purple-900 opacity-90"></div>
        <div class="absolute inset-0 opacity-10" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'#ffffff\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
        
        <div class="relative container mx-auto px-4 py-20 lg:py-28 text-center z-10">
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold mb-6 tracking-tight">Xây dựng Website <br class="md:hidden"><span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">hoàn hảo</span> của bạn</h1>
            <p class="text-lg md:text-xl text-slate-300 mb-10 max-w-2xl mx-auto font-light">Khám phá hàng trăm mẫu HTML, Admin Dashboard và giao diện thương mại điện tử chất lượng cao từ các chuyên gia.</p>
            
            <!-- Thanh tìm kiếm -->
            <div class="max-w-3xl mx-auto bg-white rounded-full p-2 flex shadow-2xl focus-within:ring-4 focus-within:ring-indigo-500/30 transition-all">
                <div class="flex items-center pl-4 pr-2 text-slate-400"><i class="fa-solid fa-search"></i></div>
                <input type="text" id="search-input" placeholder="Tìm kiếm ví dụ: 'organic', 'admin dashboard'..." class="flex-1 bg-transparent border-none focus:outline-none text-slate-800 px-2 py-3 w-full text-base">
                <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-full font-bold transition-colors">Tìm kiếm</button>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-16">
        <!-- Category Filters & Sorting -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <h2 class="text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-fire text-orange-500"></i> Mẫu mới nổi bật
            </h2>
            
            <div class="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto">
                <!-- Tabs Lọc -->
                <div class="flex flex-wrap justify-center gap-2 bg-slate-200/50 dark:bg-slate-800/50 p-1.5 rounded-full border border-slate-200 dark:border-slate-700">
                    <button class="filter-btn bg-white dark:bg-slate-700 text-slate-800 dark:text-white px-5 py-2 rounded-full font-semibold shadow-sm transition-all text-sm" data-cat="all">Tất cả</button>
                    <button class="filter-btn text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white px-5 py-2 rounded-full font-semibold transition-all text-sm" data-cat="shop">E-Commerce</button>
                    <button class="filter-btn text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white px-5 py-2 rounded-full font-semibold transition-all text-sm" data-cat="admin">Admin Dashboard</button>
                </div>

                <!-- Dropdown Sắp xếp -->
                <div class="relative w-full sm:w-auto">
                    <select id="sort-select" class="appearance-none bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-medium py-2 pl-4 pr-10 rounded-full focus:outline-none focus:ring-2 focus:ring-indigo-500 w-full sm:w-auto cursor-pointer shadow-sm">
                        <option value="newest">Mới nhất</option>
                        <option value="popular">Bán chạy nhất</option>
                        <option value="price-asc">Giá: Thấp đến Cao</option>
                        <option value="price-desc">Giá: Cao xuống Thấp</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 top-3 text-slate-400 pointer-events-none text-sm"></i>
                </div>
            </div>
        </div>

        <!-- Grid Render từ JS -->
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- App.js sẽ điền html vào đây -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 mt-10">
        <div class="container mx-auto px-4 text-center">
            <p class="mb-4 text-white font-bold text-xl"><i class="fa-solid fa-layer-group text-indigo-500"></i> WebMarket</p>
            <p class="text-sm">&copy; 2024 WebMarket Marketplace. Mọi quyền được bảo lưu.</p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
