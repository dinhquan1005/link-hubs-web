<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng | WebMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-[#f8fafc] dark:bg-[#0b0f19] transition-colors duration-300 text-slate-800 dark:text-slate-200 min-h-screen flex flex-col">

    <header class="bg-white/70 dark:bg-[#0b0f19]/80 backdrop-blur-xl border-b border-slate-200/50 dark:border-slate-800/50 fixed top-0 w-full z-50 transition-all duration-300">
        <div class="container mx-auto px-4 py-4 sm:py-5 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-extrabold flex items-center gap-2 tracking-tight">
                <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/30"><i class="fa-solid fa-layer-group text-white text-sm"></i></div>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300">WebMarket</span>
            </a>
            <div class="flex items-center gap-4 md:gap-6">
                <div id="auth-menu-container" class="hidden sm:flex items-center gap-4"></div>
                <div class="w-px h-6 bg-slate-200 dark:bg-slate-800 hidden sm:block"></div>
                <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><i class="fa-solid fa-moon text-lg"></i></button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 pt-32 pb-16 max-w-6xl flex-1">
        <h1 class="text-4xl font-black text-slate-900 dark:text-white mb-10 tracking-tight">Giỏ hàng của bạn</h1>

        <div class="flex flex-col lg:flex-row gap-10">
            <div class="lg:w-2/3 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800/80 shadow-xl shadow-slate-200/40 dark:shadow-none p-6 md:p-8" id="cart-items-container">
                </div>

            <div class="lg:w-1/3">
                <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800/80 shadow-2xl shadow-indigo-500/5 p-8 sticky top-32">
                    <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-6">Tổng quan</h2>
                    
                    <div class="flex justify-between mb-4 text-slate-600 dark:text-slate-400 font-medium">
                        <span>Tổng sản phẩm</span>
                        <span id="subtotal-price" class="text-slate-900 dark:text-white font-bold">$0</span>
                    </div>
                    
                    <div class="flex justify-between items-end mb-8 border-t border-slate-100 dark:border-slate-800 pt-6">
                        <span class="text-lg font-bold">Thành tiền</span>
                        <span id="total-price" class="text-4xl font-black text-indigo-600 dark:text-indigo-400 tracking-tighter">$0</span>
                    </div>
                    
                    <button id="checkout-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-all shadow-xl shadow-indigo-500/30 transform hover:-translate-y-1 text-lg flex justify-center items-center gap-2">
                        Thanh toán ngay <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    
                    <div class="mt-8 text-center">
                        <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mb-3">Thanh toán an toàn với</p>
                        <div class="flex justify-center items-center gap-4 text-slate-300 dark:text-slate-600">
                            <i class="fa-brands fa-cc-visa text-4xl"></i>
                            <i class="fa-brands fa-cc-mastercard text-4xl"></i>
                            <i class="fa-brands fa-cc-paypal text-4xl"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white dark:bg-[#0b0f19] border-t border-slate-200 dark:border-slate-800 py-8 mt-auto">
        <div class="container mx-auto text-center"><p class="text-sm font-semibold text-slate-400">&copy; 2024 WebMarket Checkout.</p></div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
