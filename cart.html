<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng | WebMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-200 text-slate-800 dark:text-slate-200 font-sans">

<!-- Header chuyên nghiệp -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <!-- Cột trái: Logo -->
            <a href="index.html" class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 flex items-center gap-2">
                <i class="fa-solid fa-layer-group text-indigo-600"></i> WebMarket
            </a>
            
            <!-- Cột phải: Menu Auth, DarkMode, Giỏ hàng -->
            <div class="flex items-center gap-4 sm:gap-6 md:gap-8">
                <!-- Khu vực Auth (JS tự điền) -->
                <div id="auth-menu-container" class="flex items-center"></div>

                <div class="w-px h-6 bg-slate-300 dark:bg-slate-700 hidden sm:block"></div>
                
                <button id="theme-toggle" class="text-slate-500 hover:text-indigo-600 transition-colors text-lg"><i class="fa-solid fa-moon"></i></button>
                
                <a href="cart.html" class="relative text-slate-700 dark:text-slate-300 hover:text-indigo-600 transition-colors text-xl">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-rose-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center border-2 border-white dark:border-slate-900 box-content">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10 max-w-5xl">
        <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white mb-8 border-b border-slate-200 dark:border-slate-800 pb-4">Giỏ hàng của bạn</h1>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Khu vực render danh sách sản phẩm (DOM id này được gọi trong main.js) -->
            <div class="lg:w-2/3 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6" id="cart-items-container">
                <!-- Nội dung ở đây sẽ do hàm App.renderCartPage() trong main.js điền vào -->
            </div>

            <!-- Khung Tổng kết Order -->
            <div class="lg:w-1/3">
                <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-6 sticky top-28">
                    <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-6 border-b border-slate-100 dark:border-slate-700 pb-4">Tóm tắt đơn hàng</h2>
                    
                    <div class="flex justify-between mb-4 text-slate-600 dark:text-slate-400">
                        <span>Tạm tính</span>
                        <span id="subtotal-price" class="font-medium">$0</span>
                    </div>
                    
                    <div class="flex justify-between mb-6 text-xl font-bold text-slate-900 dark:text-white border-t border-slate-100 dark:border-slate-700 pt-4">
                        <span>Tổng cộng</span>
                        <span id="total-price" class="text-indigo-600 dark:text-indigo-400">$0</span>
                    </div>
                    
                    <!-- Nút thanh toán đã được gắn id='checkout-btn' để JS xử lý -->
                    <button id="checkout-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl transition-all flex justify-center items-center gap-2 shadow-lg shadow-indigo-500/30 transform hover:-translate-y-1">
                        Tiến hành thanh toán <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    
                    <div class="mt-6 flex justify-center items-center gap-4 opacity-60">
                        <i class="fa-brands fa-cc-visa text-3xl"></i>
                        <i class="fa-brands fa-cc-mastercard text-3xl"></i>
                        <i class="fa-brands fa-cc-paypal text-3xl"></i>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 mt-10">
        <div class="container mx-auto px-4 text-center">
            <p class="mb-4 text-white font-bold text-xl"><i class="fa-solid fa-layer-group text-indigo-500"></i> WebMarket</p>
            <p class="text-sm">&copy; 2024 WebMarket. Đảm bảo thanh toán an toàn 100%.</p>
        </div>
    </footer>

    <!-- Gọi file main.js là đủ, không cần viết lại logic JS trong file này nữa -->
    <script src="assets/js/main.js"></script>
</body>
</html>
