<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Mẫu | WebMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-200 text-slate-800 dark:text-slate-200 font-sans">

    <!-- Header chuyên nghiệp -->
    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <!-- Cột trái: Logo -->
            <a href="index.html" class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 flex items-center gap-2">
                <i class="fa-solid fa-layer-group text-indigo-600"></i> WebMarket
            </a>
            
            <!-- Cột phải: Menu Auth, DarkMode, Giỏ hàng -->
            <div class="flex items-center gap-4 sm:gap-6 md:gap-8">
                <!-- Khu vực Auth (JS tự điền) -->
                <div id="auth-menu-container" class="flex items-center"></div>

                <div class="w-px h-6 bg-slate-300 dark:bg-slate-700 hidden sm:block"></div>
                
                <button id="theme-toggle" class="text-slate-500 hover:text-indigo-600 transition-colors text-lg"><i class="fa-solid fa-moon"></i></button>
                
                <a href="cart.html" class="relative text-slate-700 dark:text-slate-300 hover:text-indigo-600 transition-colors text-xl">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-rose-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center border-2 border-white dark:border-slate-900 box-content">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Product Header Bar -->
    <div class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 pt-8 pb-6">
        <div class="container mx-auto px-4" id="product-header">
            <!-- Render từ JS (Tiêu đề, Breadcrumb) -->
        </div>
    </div>

    <!-- Main Detail Layout -->
    <main class="container mx-auto px-4 py-8">
        <div class="flex flex-col lg:flex-row gap-8" id="product-detail-container">
            <!-- Render phần thân từ JS (Chia 2 cột) -->
        </div>
    </main>

    <script src="assets/js/main.js"></script>
<script>
    App.initProductPage = function() {
        const id = parseInt(new URLSearchParams(window.location.search).get('id'));
        
        // Đã sửa thành this.state.productsDB
        const p = this.state.productsDB.find(x => x.id === id); 
        if (!p) { window.location.href = 'index.html'; return; }
        document.title = `${p.name} - WebMarket`;

        // Lấy 3 sản phẩm liên quan (Cũng sửa thành this.state.productsDB)
        const related = this.state.productsDB.filter(item => item.category === p.category && item.id !== p.id).slice(0, 3);
        let relatedHTML = '';
        if(related.length > 0) {
            relatedHTML = related.map(item => `
                <a href="product.html?id=${item.id}" class="group bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 overflow-hidden shadow-sm hover:shadow-lg transition-all flex flex-col">
                    <div class="h-32 overflow-hidden bg-slate-100">
                        <img src="${item.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <h4 class="font-bold text-slate-900 dark:text-white text-sm line-clamp-1 mb-2">${item.name}</h4>
                        <div class="text-indigo-600 dark:text-indigo-400 font-extrabold">$${item.price}</div>
                    </div>
                </a>
            `).join('');
            
            relatedHTML = `
                <div class="mt-12 border-t border-slate-200 dark:border-slate-700 pt-8">
                    <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-6">Sản phẩm cùng thể loại</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">${relatedHTML}</div>
                </div>`;
        }

        document.getElementById('product-detail-container').innerHTML = `
            <div class="bg-white dark:bg-slate-800 rounded-xl border p-6 shadow-sm mt-8 w-full lg:w-2/3">
                <h3 class="text-xl font-bold mb-6 border-b pb-4">Đánh giá từ khách hàng</h3>
                <div id="reviews-list" class="mb-8 max-h-64 overflow-y-auto"></div>
                <form id="review-form" class="bg-slate-50 p-6 rounded-xl border">
                    <h4 class="font-bold mb-4">Viết đánh giá của bạn</h4>
                    <div class="flex gap-4 mb-4">
                        <select id="review-rating" class="p-2 border rounded-lg focus:ring-2 focus:ring-amber-400">
                            <option value="5">⭐⭐⭐⭐⭐ Tuyệt vời</option>
                            <option value="4">⭐⭐⭐⭐ Rất tốt</option>
                            <option value="3">⭐⭐⭐ Tạm được</option>
                        </select>
                    </div>
                    <textarea id="review-comment" required rows="3" class="w-full p-3 border rounded-lg mb-4" placeholder="Code rất sạch và dễ hiểu..."></textarea>
                    <button type="submit" class="bg-slate-900 text-white px-6 py-2 rounded-lg font-bold">Gửi đánh giá</button>
                </form>
                ${relatedHTML}
            </div>

            <div class="w-full lg:w-1/3">
                <div class="sticky top-24">
                    <img src="${p.image}" class="w-full rounded-xl shadow-sm mb-4">
                    <h1 class="text-2xl font-bold mb-2 text-slate-900 dark:text-white">${p.name}</h1>
                    <div class="text-3xl font-black text-indigo-600 mb-4">$${p.price}</div>
                    <div class="flex flex-col gap-3 mt-6">
                        <button id="btn-add-cart" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold py-3.5 rounded-xl border border-indigo-200 transition-colors flex justify-center items-center gap-2">
                            <i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ
                        </button>
                        <button id="btn-buy-now" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-transform transform hover:-translate-y-1 flex justify-center items-center gap-2">
                            <i class="fa-solid fa-bolt"></i> Mua ngay
                        </button>
                    </div>
                </div>
            </div>
        `;

        // Gắn sự kiện cho nút ở cột phải vừa tạo
        document.getElementById('btn-add-cart').onclick = () => App.addToCart(p.id);
        document.getElementById('btn-buy-now').onclick = () => App.buyNow(p.id);
        App.renderReviews(p);
    }
</script>
</body>
</html>
