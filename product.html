<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Mẫu | WebMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-[#f8fafc] dark:bg-[#0b0f19] transition-colors duration-300 text-slate-800 dark:text-slate-200">

    <header class="bg-white/70 dark:bg-[#0b0f19]/80 backdrop-blur-xl border-b border-slate-200/50 dark:border-slate-800/50 fixed top-0 w-full z-50 transition-all duration-300">
        <div class="container mx-auto px-4 py-4 sm:py-5 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-extrabold flex items-center gap-2 tracking-tight">
                <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-layer-group text-white text-sm"></i>
                </div>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300">WebMarket</span>
            </a>
            <div class="flex items-center gap-4 md:gap-6">
                <div id="auth-menu-container" class="hidden sm:flex items-center gap-4"></div>
                <div class="w-px h-6 bg-slate-200 dark:bg-slate-800 hidden sm:block"></div>
                <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><i class="fa-solid fa-moon text-lg"></i></button>
                <a href="cart.html" class="relative w-10 h-10 rounded-full flex items-center justify-center text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cart-badge" class="absolute top-1 right-1 translate-x-1 -translate-y-1 bg-rose-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center border-2 border-white dark:border-[#0b0f19]">0</span>
                </a>
            </div>
        </div>
    </header>

    <div class="bg-white dark:bg-[#0b0f19] pt-32 pb-8 border-b border-slate-200 dark:border-slate-800/80 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-96 h-96 bg-indigo-600/10 rounded-full blur-[100px] pointer-events-none"></div>
        <div class="container mx-auto px-4 relative z-10" id="product-header">
            </div>
    </div>

    <main class="container mx-auto px-4 py-12 max-w-6xl">
        <div class="flex flex-col lg:flex-row gap-10" id="product-detail-container">
            </div>
    </main>

    <footer class="bg-white dark:bg-[#0b0f19] border-t border-slate-200 dark:border-slate-800 py-12 mt-auto">
        <div class="container mx-auto text-center"><p class="text-sm font-semibold text-slate-400">&copy; 2024 WebMarket Pro Max.</p></div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        App.initProductPage = function() {
            const id = parseInt(new URLSearchParams(window.location.search).get('id'));
            const p = this.state.productsDB.find(x => x.id === id); 
            if (!p) { window.location.href = 'index.html'; return; }
            document.title = `${p.name} - WebMarket`;

            // Render Header
            const header = document.getElementById('product-header');
            if(header) {
                header.innerHTML = `
                    <div class="flex items-center gap-2 text-sm font-bold text-slate-500 dark:text-slate-400 mb-6">
                        <a href="index.html" class="hover:text-indigo-600 transition-colors">Trang chủ</a>
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                        <span class="px-2 py-0.5 bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 rounded uppercase tracking-wider text-xs">${p.category}</span>
                    </div>
                    <h1 class="text-4xl lg:text-5xl font-black text-slate-900 dark:text-white tracking-tight mb-4">${p.name}</h1>
                    <div class="flex items-center gap-6 text-sm font-medium text-slate-600 dark:text-slate-400">
                        <span class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800 flex items-center justify-center text-slate-900 dark:text-white font-bold">${p.author.charAt(0)}</div> ${p.author}</span>
                        <span class="flex items-center gap-1 text-amber-400 font-bold"><i class="fa-solid fa-star"></i> ${p.rating}</span>
                        <span class="flex items-center gap-1"><i class="fa-solid fa-cart-shopping"></i> ${p.sales} Sales</span>
                    </div>
                `;
            }

            // Render Nội dung chính
            document.getElementById('product-detail-container').innerHTML = `
                <div class="w-full lg:w-2/3 space-y-10">
                    <div class="rounded-3xl overflow-hidden border border-slate-200/80 dark:border-slate-800/80 shadow-2xl shadow-indigo-500/5">
                        <img src="${p.image}" class="w-full h-auto object-cover">
                    </div>
                    
                    <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800/80 p-8 md:p-10 shadow-sm">
                        <h2 class="text-2xl font-black mb-6 text-slate-900 dark:text-white">Chi tiết Template</h2>
                        <div class="prose dark:prose-invert max-w-none text-slate-600 dark:text-slate-300 font-medium leading-relaxed mb-10">
                            ${p.desc || p.shortDesc}
                        </div>

                        <h3 class="text-xl font-bold mb-6 border-b border-slate-100 dark:border-slate-800 pb-4">Đánh giá & Nhận xét</h3>
                        <div id="reviews-list" class="mb-8 space-y-4 max-h-96 overflow-y-auto pr-4"></div>
                        
                        <form id="review-form" class="bg-slate-50 dark:bg-slate-800/50 p-6 md:p-8 rounded-2xl border border-slate-100 dark:border-slate-700">
                            <h4 class="font-bold mb-4 text-slate-900 dark:text-white text-lg">Trải nghiệm của bạn?</h4>
                            <div class="flex gap-4 mb-4">
                                <select id="review-rating" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-bold py-3 px-4 rounded-xl focus:ring-2 focus:ring-indigo-500 w-full md:w-auto outline-none">
                                    <option value="5">⭐⭐⭐⭐⭐ Tuyệt hảo</option>
                                    <option value="4">⭐⭐⭐⭐ Rất tốt</option>
                                    <option value="3">⭐⭐⭐ Tạm được</option>
                                </select>
                            </div>
                            <textarea id="review-comment" required rows="3" class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 p-4 rounded-xl mb-4 focus:ring-2 focus:ring-indigo-500 outline-none resize-none font-medium" placeholder="Bạn thấy code cấu trúc có chuẩn không?..."></textarea>
                            <button type="submit" class="bg-slate-900 hover:bg-indigo-600 dark:bg-white dark:hover:bg-indigo-500 text-white dark:text-slate-900 px-8 py-3.5 rounded-xl font-bold transition-all shadow-lg">Gửi nhận xét</button>
                        </form>
                    </div>
                </div>

                <div class="w-full lg:w-1/3">
                    <div class="sticky top-28 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800/80 p-8 shadow-2xl shadow-slate-200/50 dark:shadow-indigo-500/5">
                        <div class="flex items-end gap-2 mb-8">
                            <span class="text-5xl font-black text-indigo-600 dark:text-indigo-400 tracking-tighter">$${p.price}</span>
                            <span class="text-slate-400 font-medium mb-1">/ Cấp phép vĩnh viễn</span>
                        </div>

                        <div class="flex flex-col gap-4 mb-8">
                            <button id="btn-add-cart" class="w-full bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-500/10 dark:hover:bg-indigo-500/20 text-indigo-700 dark:text-indigo-400 font-bold py-4 rounded-2xl transition-colors flex justify-center items-center gap-2">
                                <i class="fa-solid fa-cart-plus text-lg"></i> Thêm vào giỏ
                            </button>
                            <button id="btn-buy-now" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-indigo-500/30 transition-transform transform hover:-translate-y-1 flex justify-center items-center gap-2 text-lg">
                                <i class="fa-solid fa-bolt text-amber-300"></i> Mua ngay
                            </button>
                        </div>

                        <ul class="space-y-4 text-sm font-medium text-slate-600 dark:text-slate-400 mb-8 border-t border-slate-100 dark:border-slate-800 pt-6">
                            <li class="flex items-center gap-3"><i class="fa-solid fa-check text-emerald-500"></i> 100% Mã nguồn sạch & Tối ưu</li>
                            <li class="flex items-center gap-3"><i class="fa-solid fa-check text-emerald-500"></i> Hỗ trợ kỹ thuật 6 tháng</li>
                            <li class="flex items-center gap-3"><i class="fa-solid fa-check text-emerald-500"></i> Cập nhật tính năng trọn đời</li>
                        </ul>

                        <div class="absolute inset-0 bg-slate-900/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-5 z-10">
                            <button onclick="App.showDemoModal(${p.id})" class="w-full bg-white text-slate-900 text-center py-3.5 rounded-xl font-bold text-sm shadow-xl hover:bg-indigo-600 hover:text-white transition-colors">Xem Live Demo</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('btn-add-cart').onclick = () => App.addToCart(p.id);
            document.getElementById('btn-buy-now').onclick = () => App.buyNow(p.id);
            App.renderReviews(p);
        }
    </script>
</body>
</html>
