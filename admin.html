<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin | WebMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-[#f8fafc] dark:bg-[#0b0f19] transition-colors duration-300 text-slate-800 dark:text-slate-200 font-sans" id="admin-layout">

    <div class="flex h-screen overflow-hidden relative">
        
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[120px] pointer-events-none z-0"></div>
        <div class="absolute bottom-0 left-64 w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[120px] pointer-events-none z-0"></div>

        <aside class="w-72 bg-white/80 dark:bg-slate-900/80 backdrop-blur-2xl border-r border-slate-200/80 dark:border-slate-800/80 flex flex-col flex-shrink-0 z-20 shadow-2xl shadow-indigo-500/5">
            <div class="h-24 flex items-center px-8 border-b border-slate-200/50 dark:border-slate-800/50">
                <a href="index.html" class="text-2xl font-black flex items-center gap-3 tracking-tight">
                    <div class="w-10 h-10 bg-gradient-to-br from-emerald-400 to-teal-600 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/30">
                        <i class="fa-solid fa-shield-halved text-white text-lg"></i>
                    </div>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-600 dark:from-white dark:to-slate-300">ADMIN</span>
                </a>
            </div>
            
            <nav class="flex-1 px-4 py-8 space-y-2 overflow-y-auto">
                <p class="px-4 text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Menu Chính</p>
                <button onclick="App.switchAdminTab('dashboard')" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-left font-bold focus:bg-emerald-50 dark:focus:bg-emerald-500/10 focus:text-emerald-600 dark:focus:text-emerald-400 group text-slate-600 dark:text-slate-300">
                    <i class="fa-solid fa-chart-pie w-6 text-xl group-focus:text-emerald-500"></i> Tổng quan Sàn
                </button>
                <button onclick="App.switchAdminTab('products')" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-left font-bold focus:bg-emerald-50 dark:focus:bg-emerald-500/10 focus:text-emerald-600 dark:focus:text-emerald-400 group text-slate-600 dark:text-slate-300">
                    <i class="fa-solid fa-layer-group w-6 text-xl group-focus:text-emerald-500"></i> Quản lý Giao diện
                </button>
                <button onclick="App.switchAdminTab('users')" class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors text-left font-bold focus:bg-emerald-50 dark:focus:bg-emerald-500/10 focus:text-emerald-600 dark:focus:text-emerald-400 group text-slate-600 dark:text-slate-300">
                    <i class="fa-solid fa-users w-6 text-xl group-focus:text-emerald-500"></i> Quản lý User
                </button>
            </nav>

            <div class="p-6 border-t border-slate-200/50 dark:border-slate-800/50">
                <button onclick="App.logout()" class="w-full flex items-center justify-center gap-3 bg-slate-100 hover:bg-rose-500 dark:bg-slate-800 dark:hover:bg-rose-600 text-slate-600 dark:text-slate-300 hover:text-white dark:hover:text-white px-5 py-4 rounded-2xl font-bold transition-all shadow-sm">
                    <i class="fa-solid fa-right-from-bracket"></i> Thoát Admin
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden relative z-10">
            
            <header class="h-24 bg-white/50 dark:bg-[#0b0f19]/50 backdrop-blur-md border-b border-slate-200/50 dark:border-slate-800/50 flex items-center justify-between px-10 z-20">
                <h2 class="font-black text-2xl text-slate-900 dark:text-white tracking-tight">Hệ thống Điều hành Trung tâm</h2>
                <div class="flex items-center gap-6">
                    <button id="theme-toggle" class="w-12 h-12 rounded-full bg-white dark:bg-slate-800 flex items-center justify-center text-slate-500 hover:text-indigo-600 transition-all shadow-sm border border-slate-200/50 dark:border-slate-700">
                        <i class="fa-solid fa-moon text-xl"></i>
                    </button>
                    <div class="flex items-center gap-3 pl-6 border-l border-slate-200 dark:border-slate-800">
                        <div class="text-right hidden md:block">
                            <p class="text-sm font-bold text-slate-900 dark:text-white">Admin Tâm Quyết</p>
                            <p class="text-xs font-semibold text-emerald-500">Super Admin</p>
                        </div>
                        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center font-black text-xl border-2 border-emerald-200"><i class="fa-solid fa-user-shield"></i></div>
                    </div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-10">
                
                <div id="admin-tab-dashboard" class="space-y-10">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div class="bg-white dark:bg-slate-800/80 backdrop-blur-md p-8 rounded-[2rem] shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200/50 dark:border-slate-700/50 relative overflow-hidden group">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
                            <div class="w-14 h-14 bg-blue-100 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center text-2xl mb-6"><i class="fa-solid fa-users"></i></div>
                            <p class="text-slate-500 dark:text-slate-400 font-bold text-sm uppercase tracking-widest mb-2">Tổng User</p>
                            <h3 class="text-5xl font-black text-slate-900 dark:text-white" id="admin-total-users">0</h3>
                        </div>
                        <div class="bg-white dark:bg-slate-800/80 backdrop-blur-md p-8 rounded-[2rem] shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200/50 dark:border-slate-700/50 relative overflow-hidden group">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-purple-500/10 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
                            <div class="w-14 h-14 bg-purple-100 dark:bg-purple-500/20 text-purple-600 dark:text-purple-400 rounded-2xl flex items-center justify-center text-2xl mb-6"><i class="fa-solid fa-cubes"></i></div>
                            <p class="text-slate-500 dark:text-slate-400 font-bold text-sm uppercase tracking-widest mb-2">Tổng Sản Phẩm</p>
                            <h3 class="text-5xl font-black text-slate-900 dark:text-white" id="admin-total-products">0</h3>
                        </div>
                        <div class="bg-white dark:bg-slate-800/80 backdrop-blur-md p-8 rounded-[2rem] shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200/50 dark:border-slate-700/50 relative overflow-hidden group">
                            <div class="absolute top-0 right-0 w-32 h-32 bg-emerald-500/10 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
                            <div class="w-14 h-14 bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 rounded-2xl flex items-center justify-center text-2xl mb-6"><i class="fa-solid fa-money-bill-trend-up"></i></div>
                            <p class="text-slate-500 dark:text-slate-400 font-bold text-sm uppercase tracking-widest mb-2">Giá Trị Giao Dịch</p>
                            <h3 class="text-5xl font-black text-slate-900 dark:text-white" id="admin-total-revenue">$0</h3>
                        </div>
                    </div>
                </div>

                <div id="admin-tab-products" class="hidden">
                    <div class="bg-white dark:bg-slate-800/80 backdrop-blur-md rounded-[2rem] shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200/50 dark:border-slate-700/50 overflow-hidden">
                        <div class="p-8 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50">
                            <h3 class="text-2xl font-black text-slate-900 dark:text-white">Kho Dữ Liệu WebMarket</h3>
                        </div>
                        <div class="overflow-x-auto p-4">
                            <table class="w-full text-left whitespace-nowrap">
                                <thead class="text-slate-400 text-xs uppercase font-bold tracking-widest">
                                    <tr><th class="p-5">Sản phẩm</th><th class="p-5">Người bán</th><th class="p-5">Giá</th><th class="p-5 text-center">Đã bán</th><th class="p-5 text-right">Hành động</th></tr>
                                </thead>
                                <tbody id="admin-products-table" class="divide-y divide-slate-100 dark:divide-slate-700/50 text-slate-700 dark:text-slate-300"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="admin-tab-users" class="hidden">
                    <div class="bg-white dark:bg-slate-800/80 backdrop-blur-md rounded-[2rem] shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-200/50 dark:border-slate-700/50 overflow-hidden">
                        <div class="p-8 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50">
                            <h3 class="text-2xl font-black text-slate-900 dark:text-white">Hồ Sơ Người Dùng</h3>
                        </div>
                        <div class="overflow-x-auto p-4">
                            <table class="w-full text-left whitespace-nowrap">
                                <thead class="text-slate-400 text-xs uppercase font-bold tracking-widest">
                                    <tr><th class="p-5">Tên User</th><th class="p-5">Email</th><th class="p-5 text-center">Đã mua</th><th class="p-5 text-right">Trạng thái</th></tr>
                                </thead>
                                <tbody id="admin-users-table" class="divide-y divide-slate-100 dark:divide-slate-700/50 text-slate-700 dark:text-slate-300"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <div id="toast-container" class="fixed bottom-8 right-8 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <script src="assets/js/main.js"></script>
</body>
</html>
