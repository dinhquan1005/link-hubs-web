<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng bán sản phẩm | WebMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.6/quill.snow.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.6/quill.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-[#f8fafc] dark:bg-[#0b0f19] transition-colors duration-300 text-slate-800 dark:text-slate-200">

    <header class="bg-white/70 dark:bg-[#0b0f19]/80 backdrop-blur-xl border-b border-slate-200/50 dark:border-slate-800/50 fixed top-0 w-full z-50 transition-all duration-300">
        <div class="container mx-auto px-4 py-4 sm:py-5 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-extrabold flex items-center gap-2 tracking-tight">
                <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/30"><i class="fa-solid fa-layer-group text-white text-sm"></i></div>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300">WebMarket</span>
            </a>
            <div class="flex items-center gap-4 md:gap-6">
                <div id="auth-menu-container" class="hidden sm:flex items-center gap-4"></div>
                <div class="w-px h-6 bg-slate-200 dark:bg-slate-800 hidden sm:block"></div>
                <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><i class="fa-solid fa-moon text-lg"></i></button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 pt-32 pb-16 max-w-4xl">
        <div class="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl shadow-indigo-500/5 border border-slate-200/80 dark:border-slate-800/80 p-8 md:p-12 relative overflow-hidden">
            <div class="absolute -top-32 -right-32 w-64 h-64 bg-indigo-500/20 rounded-full blur-[80px] pointer-events-none"></div>

            <div class="relative z-10">
                <h1 class="text-4xl font-black text-slate-900 dark:text-white mb-3 tracking-tight">Phát hành Giao diện</h1>
                <p class="text-slate-500 dark:text-slate-400 mb-10 font-medium text-lg">Đưa tuyệt tác mã nguồn của bạn tiếp cận hàng ngàn lập trình viên.</p>

                <form id="add-product-form" class="space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-3">Tên Giao diện <span class="text-rose-500">*</span></label>
                            <input type="text" id="p-name" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-2xl px-5 py-4 focus:ring-2 focus:ring-indigo-500 outline-none font-medium transition-all" placeholder="VD: UI8 Pro Dashboard">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-3">Phân loại <span class="text-rose-500">*</span></label>
                            <select id="p-category" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-2xl px-5 py-4 focus:ring-2 focus:ring-indigo-500 outline-none font-medium appearance-none cursor-pointer">
                                <option value="shop">E-Commerce (Thương mại)</option>
                                <option value="admin">Admin Dashboard</option>
                                <option value="portfolio">Portfolio (Cá nhân)</option>
                                <option value="landing">Landing Page</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-3">Đơn giá ($) <span class="text-rose-500">*</span></label>
                            <input type="number" id="p-price" required min="0" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-2xl px-5 py-4 focus:ring-2 focus:ring-indigo-500 outline-none font-medium" placeholder="Nhập 0 nếu miễn phí">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-3">Ảnh Bìa (Link Cover) <span class="text-rose-500">*</span></label>
                            <input type="url" id="p-image" required class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-2xl px-5 py-4 focus:ring-2 focus:ring-indigo-500 outline-none font-medium" placeholder="https://...">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-3">Mã nguồn đính kèm (File .ZIP) <span class="text-rose-500">*</span></label>
                        <div class="border-2 border-dashed border-indigo-300 dark:border-indigo-500/50 bg-indigo-50/50 dark:bg-indigo-900/10 rounded-3xl p-10 text-center hover:bg-indigo-50 dark:hover:bg-indigo-900/20 transition-all cursor-pointer relative group">
                            <input id="p-file" type="file" accept=".zip" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                            
                            <div id="upload-prompt" class="transition-all duration-300">
                                <div class="w-20 h-20 bg-white dark:bg-slate-800 shadow-lg rounded-full flex items-center justify-center mx-auto mb-6 group-hover:scale-110 transition-transform">
                                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-indigo-500"></i>
                                </div>
                                <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Tải tệp ZIP mã nguồn lên Server</h3>
                                <p class="text-slate-500 dark:text-slate-400 mb-6 font-medium">Kéo thả file vào đây hoặc nhấn để chọn từ máy tính</p>
                                <div class="inline-flex items-center gap-6 px-6 py-2 bg-white dark:bg-slate-800 rounded-full text-xs font-bold text-slate-400 shadow-sm border border-slate-100 dark:border-slate-700">
                                    <span><i class="fa-solid fa-file-zipper text-indigo-400 mr-1"></i> Chỉ .ZIP</span>
                                    <span><i class="fa-solid fa-weight-scale text-emerald-400 mr-1"></i> Max 50MB</span>
                                </div>
                            </div>

                            <div id="file-preview" class="hidden relative z-20 p-6 bg-white dark:bg-slate-800 border border-emerald-200 dark:border-emerald-500/30 rounded-2xl flex items-center justify-between shadow-xl shadow-emerald-500/5">
                                <div class="flex items-center gap-5">
                                    <div class="w-14 h-14 bg-emerald-50 dark:bg-emerald-500/20 text-emerald-500 rounded-xl flex items-center justify-center text-3xl">
                                        <i class="fa-solid fa-file-archive"></i>
                                    </div>
                                    <div class="text-left">
                                        <p id="file-name" class="text-base font-bold text-slate-900 dark:text-white line-clamp-1"></p>
                                        <p id="file-size" class="text-sm text-slate-500 mt-1 font-medium"></p>
                                    </div>
                                </div>
                                <button type="button" id="remove-file-btn" class="text-rose-500 hover:bg-rose-500 hover:text-white w-12 h-12 rounded-xl transition-colors flex items-center justify-center font-bold bg-rose-50 dark:bg-rose-500/10 dark:hover:bg-rose-500 border border-rose-100 dark:border-rose-500/20">
                                    <i class="fa-solid fa-xmark text-xl"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-3">Mô tả tổng quan & Tính năng <span class="text-rose-500">*</span></label>
                        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden focus-within:ring-2 focus-within:ring-indigo-500 transition-all">
                            <div id="p-desc-editor" class="h-64 text-slate-800 dark:text-slate-200 font-medium text-base"></div>
                        </div>
                        <input type="hidden" id="p-desc" required>
                    </div>

                    <div class="pt-6">
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-5 rounded-2xl shadow-xl shadow-indigo-500/30 transition-transform transform hover:-translate-y-1 flex items-center justify-center gap-3 text-lg">
                            <i class="fa-solid fa-rocket"></i> Xuất bản Giao diện
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
        const quill = new Quill('#p-desc-editor', {
            theme: 'snow',
            placeholder: 'Viết mô tả chi tiết, chèn link ảnh, tạo danh sách các tính năng nổi bật...',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link', 'image', 'code-block'],
                    ['clean']
                ]
            }
        });
        quill.on('text-change', function() {
            document.getElementById('p-desc').value = quill.root.innerHTML;
        });
        const fileInput = document.getElementById('p-file');
        const uploadPrompt = document.getElementById('upload-prompt');
        const filePreview = document.getElementById('file-preview');
        const fileNameEl = document.getElementById('file-name');
        const fileSizeEl = document.getElementById('file-size');
        const removeBtn = document.getElementById('remove-file-btn');

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                fileNameEl.textContent = file.name;
                fileSizeEl.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
                uploadPrompt.classList.add('hidden');
                filePreview.classList.remove('hidden');
                filePreview.classList.add('flex');
            }
        });

        removeBtn.addEventListener('click', function(e) {
            e.preventDefault(); 
            fileInput.value = ''; 
            uploadPrompt.classList.remove('hidden');
            filePreview.classList.add('hidden');
            filePreview.classList.remove('flex');
        });

        document.getElementById('add-product-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!App.state.currentUser) return App.showAuthModal('login');

            const file = fileInput.files[0];
            if (!file || !file.name.endsWith('.zip')) return App.showToast('Bắt buộc tải lên file .ZIP!', 'error');

            const submitBtn = document.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Đang tải lên máy chủ...';
            submitBtn.disabled = true;

            const formData = new FormData();
            formData.append('templateZip', file);
            formData.append('productName', document.getElementById('p-name').value.trim());

            let finalDemoUrl = ""; let finalDownloadUrl = "";

            try {
                const response = await fetch('/api/upload-template', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.success) {
                    finalDemoUrl = data.demoUrl; 
                    finalDownloadUrl = data.downloadUrl;
                } else {
                    submitBtn.innerHTML = '<i class="fa-solid fa-rocket"></i> Xuất bản Giao diện';
                    submitBtn.disabled = false;
                    return App.showToast(data.message, 'error');
                }
            } catch (error) {
                submitBtn.innerHTML = '<i class="fa-solid fa-rocket"></i> Xuất bản Giao diện';
                submitBtn.disabled = false;
                return App.showToast('Lỗi Server!', 'error');
            }

            const newProduct = {
                id: Date.now(),
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-category').value,
                price: parseInt(document.getElementById('p-price').value),
                sales: 0, rating: 5.0,
                author: App.state.currentUser.name,
                image: document.getElementById('p-image').value,
                desc: document.getElementById('p-desc').value,
                demoUrl: finalDemoUrl,
                downloadUrl: finalDownloadUrl
            };

            // ==========================================
            // NÂNG CẤP PRO MAX: LƯU TRỰC TIẾP LÊN DATABASE SERVER
            // ==========================================
            try {
                await fetch('/api/save-product', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newProduct)
                });

                App.showToast('Sản phẩm đã được đẩy lên Server Thành công!', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            } catch (err) {
                App.showToast('Lỗi khi lưu vào Database', 'error');
            }
        });
    </script>
</body>
</html>
