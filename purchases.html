<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản cá nhân | WebMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-[#f8fafc] dark:bg-[#0b0f19] transition-colors duration-300 text-slate-800 dark:text-slate-200 min-h-screen flex flex-col">

    <header class="bg-white/70 dark:bg-[#0b0f19]/80 backdrop-blur-xl border-b border-slate-200/50 dark:border-slate-800/50 fixed top-0 w-full z-50 transition-all duration-300">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-extrabold flex items-center gap-2 tracking-tight">
                <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-layer-group text-white text-sm"></i>
                </div>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300">WebMarket</span>
            </a>
            <div class="flex items-center gap-4 md:gap-6">
                <div id="auth-menu-container" class="hidden sm:flex items-center gap-4"></div>
                <div class="w-px h-6 bg-slate-200 dark:bg-slate-800 hidden sm:block"></div>
                <button id="theme-toggle" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"><i class="fa-solid fa-moon text-lg"></i></button>
                <a href="cart.html" class="relative w-10 h-10 rounded-full flex items-center justify-center text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cart-badge" class="absolute top-1 right-1 translate-x-1 -translate-y-1 bg-rose-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center border-2 border-white dark:border-[#0b0f19]">0</span>
                </a>
            </div>
        </div>
    </header>

    <section class="relative pt-32 pb-24 overflow-hidden bg-slate-950 text-white">
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop" class="w-full h-full object-cover opacity-30 mix-blend-screen">
            <div class="absolute inset-0 bg-gradient-to-b from-slate-950/80 to-[#f8fafc] dark:to-[#0b0f19]"></div>
        </div>
        <div class="relative z-10 container mx-auto px-4 max-w-5xl">
            <h1 class="text-4xl font-black tracking-tight"><i class="fa-solid fa-user-circle text-indigo-500 mr-2"></i> Tài khoản cá nhân</h1>
            <p class="text-slate-300 mt-2 font-medium text-lg">Quản lý kho tàng mã nguồn và danh sách yêu thích của bạn.</p>
        </div>
    </section>

    <main class="container mx-auto px-4 pb-16 max-w-5xl flex-1 relative z-20 -mt-10">
        <div class="flex bg-white dark:bg-slate-800 p-1.5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl mb-8 w-full md:w-max">
            <button id="tab-purchases" class="flex-1 md:flex-none px-8 py-3 font-bold rounded-xl transition-all bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 shadow-sm">Code đã mua</button>
            <button id="tab-wishlist" class="flex-1 md:flex-none px-8 py-3 font-bold rounded-xl transition-all text-slate-500 hover:text-slate-900 dark:hover:text-white">Yêu thích</button>
        </div>

        <div id="account-content" class="min-h-[400px]">
            </div>
    </main>

    <footer class="bg-white dark:bg-[#0b0f19] border-t border-slate-200 dark:border-slate-800 py-8 mt-auto">
        <div class="container mx-auto text-center"><p class="text-sm font-semibold text-slate-400">&copy; 2024 WebMarket. Tủ đồ số của bạn.</p></div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
