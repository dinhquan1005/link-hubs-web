<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard | WebMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-200 text-slate-800 dark:text-slate-200 font-sans min-h-screen flex flex-col">

    <header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 flex items-center gap-2">
                <i class="fa-solid fa-layer-group text-indigo-600"></i> WebMarket
            </a>
            <div class="flex items-center gap-4 sm:gap-6 md:gap-8">
                <div id="auth-menu-container" class="flex items-center"></div>
                <div class="w-px h-6 bg-slate-300 dark:bg-slate-700 hidden sm:block"></div>
                <button id="theme-toggle" class="text-slate-500 hover:text-indigo-600 transition-colors text-lg"><i class="fa-solid fa-moon"></i></button>
                <a href="cart.html" class="relative text-slate-700 dark:text-slate-300 hover:text-indigo-600 transition-colors text-xl">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-rose-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center border-2 border-white dark:border-slate-900 box-content">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-10 max-w-6xl flex-1" id="vendor-dashboard">
        <div class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-200 dark:border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white"><i class="fa-solid fa-chart-pie text-indigo-500 mr-2"></i> Quản Trị Cửa Hàng</h1>
                <p class="text-slate-500 mt-2 font-medium">Theo dõi doanh thu và hiệu suất bán hàng của bạn.</p>
            </div>
            <a href="add-product.html" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-indigo-500/30 transition-all transform hover:-translate-y-1"><i class="fa-solid fa-plus mr-2"></i> Đăng Giao Diện Mới</a>
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-10">
            <div class="bg-gradient-to-br from-emerald-500 to-teal-600 p-8 rounded-3xl shadow-xl shadow-emerald-500/20 text-white relative overflow-hidden group">
                <i class="fa-solid fa-sack-dollar absolute -right-6 -bottom-6 text-9xl opacity-20 group-hover:scale-110 transition-transform duration-500"></i>
                <p class="font-bold text-emerald-100 text-sm tracking-widest uppercase">Tổng Doanh Thu</p>
                <h3 class="text-5xl font-black mt-3" id="dash-revenue">$0</h3>
            </div>
            
            <div class="bg-gradient-to-br from-blue-500 to-indigo-600 p-8 rounded-3xl shadow-xl shadow-blue-500/20 text-white relative overflow-hidden group">
                <i class="fa-solid fa-cart-arrow-down absolute -right-6 -bottom-6 text-9xl opacity-20 group-hover:scale-110 transition-transform duration-500"></i>
                <p class="font-bold text-blue-100 text-sm tracking-widest uppercase">Tổng Lượt Bán</p>
                <h3 class="text-5xl font-black mt-3" id="dash-sales">0</h3>
            </div>

            <div class="bg-gradient-to-br from-purple-500 to-fuchsia-600 p-8 rounded-3xl shadow-xl shadow-purple-500/20 text-white relative overflow-hidden group">
                <i class="fa-solid fa-layer-group absolute -right-6 -bottom-6 text-9xl opacity-20 group-hover:scale-110 transition-transform duration-500"></i>
                <p class="font-bold text-purple-100 text-sm tracking-widest uppercase">Code Đang Bán</p>
                <h3 class="text-5xl font-black mt-3" id="dash-items">0</h3>
            </div>
        </div>

        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
            <div class="p-6 border-b border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-900/50">
                <h2 class="text-xl font-extrabold text-slate-900 dark:text-white">Danh sách sản phẩm</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left whitespace-nowrap">
                    <thead class="bg-slate-50 dark:bg-slate-900/80 text-slate-500 dark:text-slate-400 text-xs uppercase font-bold tracking-wider">
                        <tr>
                            <th class="py-5 px-6">Tên Template</th>
                            <th class="py-5 px-6">Đơn giá</th>
                            <th class="py-5 px-6 text-center">Đã bán</th>
                            <th class="py-5 px-6 text-right">Tổng thu</th>
                        </tr>
                    </thead>
                    <tbody id="dash-table-body" class="divide-y divide-slate-100 dark:divide-slate-700 text-slate-700 dark:text-slate-300">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 mt-auto">
        <div class="container mx-auto text-center"><p>&copy; 2024 WebMarket Dashboard.</p></div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
